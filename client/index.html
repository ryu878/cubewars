<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cubewars</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #87ceeb;
      }
      #app {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #status {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 6px 12px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        border-radius: 6px;
        z-index: 10;
        pointer-events: none;
      }
      #hint {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.35);
        color: #fff;
        font-family: system-ui, sans-serif;
        text-align: center;
        z-index: 5;
        /* Let clicks pass through to the canvas below so clicking the hint itself engages pointer lock. */
        pointer-events: none;
      }
      #hint .hint-box {
        padding: 16px 24px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 10px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="status" data-state="connecting">connecting…</div>
    <div id="hint">
      <div class="hint-box">
        <strong>Click to play</strong><br />
        WASD move &middot; Mouse look &middot; Space jump &middot; Esc to release
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
