<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cubewars</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #87ceeb;
      }
      #app {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #status {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 6px 12px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        border-radius: 6px;
        z-index: 10;
        pointer-events: none;
      }
      #hint {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.35);
        color: #fff;
        font-family: system-ui, sans-serif;
        text-align: center;
        z-index: 5;
        /* Let clicks pass through to the canvas below so clicking the hint itself engages pointer lock. */
        pointer-events: none;
      }
      #hint .hint-box {
        padding: 16px 24px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 10px;
        line-height: 1.6;
      }

      /* --- EPIC 4 combat HUD: crosshair, health, hit/damage/muzzle feedback, death overlay --- */

      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 18px;
        height: 18px;
        margin: -9px 0 0 -9px;
        z-index: 6;
        pointer-events: none;
      }
      #crosshair::before,
      #crosshair::after {
        content: "";
        position: absolute;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.6);
      }
      #crosshair::before {
        left: 8px;
        top: 0;
        width: 2px;
        height: 18px;
      }
      #crosshair::after {
        top: 8px;
        left: 0;
        width: 18px;
        height: 2px;
      }

      #healthHud {
        position: fixed;
        top: 12px;
        right: 12px;
        padding: 6px 12px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        border-radius: 6px;
        z-index: 10;
        pointer-events: none;
      }
      #healthHud[data-low="true"] {
        color: #ff8a8a;
      }

      /* --- EPIC 6 weapon HUD: equipped weapon name + ammo, color-coded per weapon --- */

      #weaponHud {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 14px;
        background: rgba(0, 0, 0, 0.6);
        color: #9e9e9e;
        font-family: system-ui, sans-serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
        border-radius: 6px;
        z-index: 10;
        pointer-events: none;
      }
      #weaponHud[data-empty="true"] {
        animation: weapon-empty-pulse 700ms ease-in-out infinite;
      }
      @keyframes weapon-empty-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }

      #hitMarker {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 24px;
        height: 24px;
        margin: -12px 0 0 -12px;
        z-index: 7;
        opacity: 0;
        transition: opacity 80ms ease-out;
        pointer-events: none;
      }
      #hitMarker.visible {
        opacity: 1;
      }
      #hitMarker::before,
      #hitMarker::after {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        width: 3px;
        height: 24px;
        margin-left: -1.5px;
        background: #ffdd33;
      }
      #hitMarker::before {
        transform: rotate(45deg);
      }
      #hitMarker::after {
        transform: rotate(-45deg);
      }

      #damageFlash {
        position: fixed;
        inset: 0;
        z-index: 4;
        background: radial-gradient(ellipse at center, rgba(220, 0, 0, 0) 55%, rgba(200, 0, 0, 0.45) 100%);
        opacity: 0;
        transition: opacity 120ms ease-out;
        pointer-events: none;
      }
      #damageFlash.visible {
        opacity: 1;
      }

      #muzzleFlash {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 40px;
        height: 40px;
        margin: -20px 0 0 -20px;
        border-radius: 50%;
        background: rgba(255, 230, 150, 0.9);
        z-index: 6;
        opacity: 0;
        transition: opacity 60ms ease-out;
        pointer-events: none;
      }
      #muzzleFlash.visible {
        opacity: 1;
      }

      #deathOverlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(80, 0, 0, 0.55);
        color: #fff;
        font-family: system-ui, sans-serif;
        font-size: 22px;
        text-align: center;
        z-index: 8;
        pointer-events: none;
      }
      #deathOverlay.visible {
        display: flex;
      }

      /* --- EPIC 5 match flow: kill feed + scoreboard --- */

      #killFeed {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        z-index: 9;
        pointer-events: none;
        font-family: system-ui, sans-serif;
      }
      .kill-feed-entry {
        padding: 5px 12px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-size: 13px;
        border-radius: 6px;
        opacity: 1;
        transition: opacity 400ms ease-out;
        white-space: nowrap;
      }
      .kill-feed-entry.involves-self {
        background: rgba(120, 20, 20, 0.75);
      }
      .kill-feed-entry.fading {
        opacity: 0;
      }
      .kill-feed-name {
        font-weight: 600;
      }

      #scoreboard {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        min-width: 260px;
        max-height: 60vh;
        overflow-y: auto;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        font-family: system-ui, sans-serif;
        border-radius: 8px;
        padding: 10px 14px;
        z-index: 11;
        display: none;
        pointer-events: none;
      }
      #scoreboard.visible {
        display: block;
      }
      #scoreboard h2 {
        margin: 0 0 8px;
        font-size: 14px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #ccc;
      }
      .scoreboard-row {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        padding: 4px 0;
        font-size: 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }
      .scoreboard-row:first-child {
        border-top: none;
      }
      .scoreboard-row.self .scoreboard-name {
        color: #ffdd33;
      }
      .scoreboard-kills {
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="status" data-state="connecting">connecting…</div>
    <div id="healthHud" data-low="false">Health: 100</div>
    <div id="weaponHud" data-empty="false">Pistol — ∞</div>
    <div id="crosshair" aria-hidden="true"></div>
    <div id="hitMarker" aria-hidden="true"></div>
    <div id="damageFlash" aria-hidden="true"></div>
    <div id="muzzleFlash" aria-hidden="true"></div>
    <div id="deathOverlay"><div>You died &mdash; respawning&hellip;</div></div>
    <div id="killFeed" aria-hidden="true"></div>
    <div id="scoreboard" aria-hidden="true">
      <h2>Scoreboard</h2>
      <div id="scoreboardList"></div>
    </div>
    <div id="hint">
      <div class="hint-box">
        <strong>Click to play</strong><br />
        WASD move &middot; Mouse look &middot; Click to fire &middot; Space jump &middot; E switch weapon &middot; Esc to release &middot; Hold Tab for scoreboard
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
